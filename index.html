      {id:'park',title:'Công viên',icon:'🌳',desc:'Thiên nhiên & hoạt động',bg:'#e5f8d9',req:3,npc:'🧑‍🌾'},
      {id:'travel',title:'Du lịch',icon:'✈️',desc:'Đi lại & khám phá',bg:'#e0f2ff',req:4,npc:'🧑‍✈️'}
    ];
    const PETS=[
      {id:'cat',name:'Mèo Miu',icon:'🐱',cost:0,desc:'Người bạn đầu tiên'},
      {id:'bunny',name:'Thỏ Bông',icon:'🐰',cost:45,desc:'Thích cà rốt và từ mới'},
      {id:'panda',name:'Gấu Trúc',icon:'🐼',cost:65,desc:'Chuyên gia ngủ trưa'},
      {id:'fox',name:'Cáo Cam',icon:'🦊',cost:85,desc:'Tinh nghịch, siêu nhanh'},

    const KEY='lingotown-save-v1';
    const DEFAULT={lang:'en',xp:0,coins:20,stars:0,progress:{},badges:{},pet:'cat',pets:['cat'],daily:{date:'',correct:0,claimed:false},streak:{date:'',count:0}};
    function clone(o){return JSON.parse(JSON.stringify(o))}
    function load(){try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(!old||typeof old!=='object')return clone(DEFAULT);return {...clone(DEFAULT),...old,progress:old.progress&&typeof old.progress==='object'?old.progress:{},badges:old.badges&&typeof old.badges==='object'?old.badges:{},pets:Array.isArray(old.pets)?old.pets:['cat'],daily:old.daily&&typeof old.daily==='object'?old.daily:clone(DEFAULT.daily),streak:old.streak&&typeof old.streak==='object'?old.streak:clone(DEFAULT.streak)}}catch{return clone(DEFAULT)}}
    let save=load();if(!['en','zh'].includes(save.lang))save.lang='en';
    const app={route:'home',zone:'home',mode:null,flashIndex:0,revealed:false,flashReview:false,reviewIds:[],quiz:null,match:null,bookQuery:'',bookFilter:'all',notice:'',lastReward:null};
    const root=document.getElementById('app');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pick=(a,n)=>shuffle([...a]).slice(0,n);
    function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    const byZone=z=>WORDS.filter(w=>w.zone===z);
    const target=w=>w[save.lang];
    const langName=()=>save.lang==='en'?'English':'中文';
    const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
    function dayDifference(a,b){const parse=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));return (parse(b)-parse(a))/86400000}
    function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch{app.notice='Trình duyệt đang chặn lưu dữ liệu. Tiến độ chỉ được giữ trong phiên này.'}}
    function getP(w){return save.progress[`${save.lang}|${w.id}`]||{reps:0,correct:0,wrong:0,due:''}}
    function ready(w){const p=getP(w);return p.reps>0&&p.due&&p.due<=today()}
    function stage(w){let p=getP(w);if(!p.correct&&!p.wrong)return 'new';if(p.reps>=4)return 'mastered';if(ready(w))return 'due';return 'learning'}
    function langCount(){return WORDS.filter(w=>getP(w).correct>0).length}
    function masteredCount(){return WORDS.filter(w=>stage(w)==='mastered').length}
    function dueCount(){return WORDS.filter(ready).length}
    function earnedStars(z){return (save.badges[`en|${z}`]?1:0)+(save.badges[`zh|${z}`]?1:0)}
    function unlocked(z){const item=ZONES.find(x=>x.id===z);return item&&save.stars>=item.req}
    function reward(xp,coins){save.xp+=xp;save.coins+=coins;persist()}
    function refreshDaily(){if(save.daily.date!==today()){save.daily={date:today(),correct:0,claimed:false};persist()}}
    function record(w,correct){refreshDaily();const id=`${save.lang}|${w.id}`;const p=save.progress[id]||{reps:0,correct:0,wrong:0,due:''};if(correct){p.correct++;p.reps=Math.min(6,p.reps+1);p.due=addDays(today(),[0,1,3,7,14,30,45][p.reps]);save.daily.correct=Math.min(5,save.daily.correct+1);const now=today();if(save.streak.date!==now){save.streak.count=save.streak.date&&dayDifference(save.streak.date,now)===1?save.streak.count+1:1;save.streak.date=now}}else{p.wrong++;p.reps=Math.max(0,p.reps-1);p.due=today()}save.progress[id]=p;persist()}
    function addDays(date,amount){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+amount);return d.toISOString().slice(0,10)}
    function zoneProgress(zone){let v=byZone(zone);return Math.round(v.filter(w=>getP(w).correct>0).length/v.length*100)}
    function lvl(){return Math.floor(save.xp/100)+1}
    function levelPercent(){return save.xp%100}
    function phrase(w){return save.lang==='en'?`Please find the ${w.en}.`:`请帮我找到${w.zh}。`}
    function pronunciation(w,full=false){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){app.notice='Trình duyệt không hỗ trợ đọc từ bằng giọng nói. Bạn vẫn có thể học bằng chữ.';render();return}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(full?phrase(w):target(w));u.lang=save.lang==='en'?'en-US':'zh-CN';u.rate=save.lang==='zh'?.78:.85;u.pitch=1.08;window.speechSynthesis.speak(u)}catch{app.notice='Không phát được âm thanh trên thiết bị này.';render()}}
    function header(){let pet=PETS.find(p=>p.id===save.pet)||PETS[0];return `<header class="topbar"><a class="brand" href="#" data-action="home" aria-label="LingoTown về trang chủ"><span class="brand-icon">✿</span> LingoTown</a><span class="capsule" title="Cấp độ">🌟 Lv.${lvl()}</span><span class="capsule" title="Xu">🪙 ${save.coins}</span><span class="capsule" title="Sao">⭐ ${save.stars}</span><div class="language" role="group" aria-label="Chọn ngôn ngữ"><button type="button" data-action="lang" data-lang="en" class="${save.lang==='en'?'active':''}" aria-pressed="${save.lang==='en'}">🇬🇧 EN</button><button type="button" data-action="lang" data-lang="zh" class="${save.lang==='zh'?'active':''}" aria-pressed="${save.lang==='zh'}">🇨🇳 中文</button></div></header><nav class="nav" aria-label="Điều hướng"><button type="button" data-action="home" class="${app.route==='home'?'active':''}">🏠 Trang chủ</button><button type="button" data-action="map" class="${['map','zone','game'].includes(app.route)?'active':''}">🗺️ Khám phá</button><button type="button" data-action="book" class="${app.route==='book'?'active':''}">📒 Sổ từ</button><button type="button" data-action="shop" class="${app.route==='shop'?'active':''}">${pet.icon} Thú cưng</button></nav>`}
    function home(){const pet=PETS.find(x=>x.id===save.pet)||PETS[0];refreshDaily();const pct=save.daily.correct/5*100;return `<section class="hero fade"><div><div class="eyebrow">✿ HỌC MỖI NGÀY, CHƠI THẬT VUI</div><h1>Hôm nay mình cùng<br>phiêu lưu nhé!</h1><p>Học <b>${langName()}</b> qua các nhiệm vụ đáng yêu, tích lũy sao và mở khóa thế giới mới.</p><button type="button" class="btn primary" data-action="map">🗺️ Khám phá thành phố →</button></div><div class="hero-art"><div class="pet-bubble">Hi! ♡</div><div class="orb"><span class="hero-pet" aria-label="${pet.name}">${pet.icon}</span></div><div class="stars-deco" aria-hidden="true">✨ 🌸 ✨</div></div></section><div class="section-row"><h2>Tiến độ của bạn</h2><span class="pill">🔥 ${save.streak.count} ngày liên tiếp</span></div><section class="cards"><div class="card feature-card"><div class="icon">📖</div><div class="big-num">${langCount()}<small> / ${WORDS.length}</small></div><p>Từ đã học (${langName()})</p></div><div class="card feature-card"><div class="icon">🏅</div><div class="big-num">${masteredCount()}</div><p>Từ thành thạo</p></div><div class="card feature-card"><div class="icon">🔁</div><div class="big-num">${dueCount()}</div><p>Từ đến hạn ôn</p></div></section><div class="section-row"><h2>Nhiệm vụ hôm nay</h2><span class="tag green">+20 xu</span></div><section class="split"><div class="card"><div class="panel-title">🎯 Trả lời đúng 5 câu</div><p class="muted">Làm nhiệm vụ, ghép cặp hoặc nghe từ để nhận phần thưởng hằng ngày.</p><div class="daily-meter"><b>${save.daily.correct}/5 câu hoàn thành</b><span>${save.daily.claimed?'Đã nhận thưởng ✓':Math.round(pct)+'%'}</span></div><div class="progress"><span style="width:${pct}%"></span></div><div style="margin-top:17px;display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary sm" data-action="claim" ${save.daily.correct<5||save.daily.claimed?'disabled':''}>${save.daily.claimed?'✓ Đã nhận':'🎁 Nhận 20 xu'}</button><button type="button" class="btn secondary sm" data-action="map">Bắt đầu chơi</button></div></div><div class="card"><div class="panel-title">${pet.icon} Bạn đồng hành</div><div class="mini-pet"><div class="animal" aria-hidden="true">${pet.icon}</div><div><b>${pet.name}</b><p class="muted" style="font-size:.87rem;margin:5px 0">Cùng bạn chinh phục thế giới ngôn ngữ!</p></div></div><div class="progress" style="margin-top:15px"><span style="width:${levelPercent()}%"></span></div><div class="daily-meter"><span>Level ${lvl()}</span><span>${save.xp%100}/100 XP</span></div></div></section><div class="section-row"><h2>Khu vực khám phá</h2><button type="button" class="btn secondary sm" data-action="map">Xem bản đồ →</button></div>${zonesHTML(3)}`}
    function zonesHTML(limit){return `<div class="zone-grid">${ZONES.slice(0,limit||ZONES.length).map(z=>{let lock=!unlocked(z.id);return `<button type="button" data-action="zone" data-zone="${z.id}" class="zone-card" ${lock?'disabled':''} aria-label="${z.title}${lock?', cần '+z.req+' sao để mở khóa':''}"><div class="zone-scene" style="background:${z.bg}">${z.icon}</div><div class="zone-top"><b>${z.title}</b><span class="tag ${lock?'':'green'}">${lock?'🔒 '+z.req+'⭐':earnedStars(z.id)?'⭐ '+earnedStars(z.id)+'/2':'Mở'}</span></div><small>${z.desc}</small><div class="progress"><span style="width:${zoneProgress(z.id)}%"></span></div><small>Đã học ${zoneProgress(z.id)}% từ vựng</small></button>`}).join('')}</div>`}
    function mapView(){return `<div class="section-row"><div><div class="eyebrow">KHÁM PHÁ LINGOTOWN</div><h1 style="margin:0">Bản đồ thành phố 🗺️</h1></div><span class="pill">⭐ ${save.stars} / 12 sao</span></div><p class="muted" style="margin-bottom:20px">Hoàn thành nhiệm vụ tại mỗi khu vực để nhận sao. Mỗi khu vực có 1 sao cho English và 1 sao cho 中文.</p>${zonesHTML()}<div class="callout" style="margin-top:18px">💡 <b>Mẹo:</b> Bắt đầu ở Ngôi nhà hoặc Tiệm cà phê. Tích lũy sao bằng nhiệm vụ để mở các khu vực tiếp theo.</div>`}
    function crumb(title){return `<div class="crumb"><button type="button" data-action="map">🗺️ Bản đồ</button><span>›</span><span>${esc(title)}</span></div>`}
    function zoneView(){let z=ZONES.find(x=>x.id===app.zone),p=zoneProgress(z.id);return `${crumb(z.title)}<div class="zone-banner" style="background:${z.bg}"><div class="scene-emoji">${z.icon}</div><div><div class="eyebrow">KHU VỰC KHÁM PHÁ</div><h1>${z.title}</h1><p class="muted" style="margin-bottom:5px">${z.desc} · ${byZone(z.id).length} từ vựng</p><span class="pill">📚 Đã học ${p}%</span></div></div><div class="section-row"><h2>Chọn cách chơi</h2><span class="pill">${langName()}</span></div><div class="mode-grid"><button type="button" data-action="start" data-mode="flash" class="mode-card"><div class="mode-icon">🃏</div><div><b>Học Flashcard</b><small>Xem từ mới, phát âm, nghĩa tiếng Việt và tự đánh giá ghi nhớ.</small></div></button><button type="button" data-action="start" data-mode="quest" class="mode-card"><div class="mode-icon">🧭</div><div><b>Nhiệm vụ NPC</b><small>Nghe yêu cầu, tìm đúng đồ vật và nhận sao để mở khóa.</small></div></button><button type="button" data-action="start" data-mode="match" class="mode-card"><div class="mode-icon">🧩</div><div><b>Ghép cặp từ vựng</b><small>Kết nối từ ngoại ngữ với nghĩa tiếng Việt tương ứng.</small></div></button><button type="button" data-action="start" data-mode="listen" class="mode-card"><div class="mode-icon">🎧</div><div><b>Nghe và chọn</b><small>Luyện nghe phát âm và nhận diện từ đúng.</small></div></button></div><div class="callout" style="margin-top:19px">✨ Mỗi lần hoàn thành nhiệm vụ NPC với ít nhất 5/6 câu đúng, bạn nhận được một sao cho khu vực và ngôn ngữ đó.</div>`}
    function stageCrumb(title){let z=ZONES.find(x=>x.id===app.zone);return `<div class="crumb"><button type="button" data-action="zone" data-zone="${app.zone}">← ${z.title}</button><span>›</span><span>${title}</span></div>`}
    function flashView(){let words=app.flashReview?app.reviewIds.map(id=>BY_ID[id]).filter(Boolean):byZone(app.zone);if(!words.length)return `${stageCrumb('Ôn tập')}<div class="empty"><div class="face">🎉</div><h2>Chưa có từ cần ôn</h2><p>Bạn có thể học thêm từ mới hoặc quay lại sau nhé!</p><button type="button" class="btn primary" data-action="zone" data-zone="${app.zone}">Học từ mới</button></div>`;app.flashIndex=Math.max(0,Math.min(app.flashIndex,words.length-1));let w=words[app.flashIndex];return `${stageCrumb(app.flashReview?'Ôn tập':'Flashcard')}<div class="stage"><div class="stage-head"><span class="hint">🃏 ${app.flashReview?'Ôn từ cần nhớ':'Học từ vựng'}</span><span class="pill">${app.flashIndex+1} / ${words.length}</span></div><div class="progress" style="margin-bottom:15px"><span style="width:${(app.flashIndex+1)/words.length*100}%"></span></div><div class="flash fade"><div class="pict">${w.emoji}</div><div class="word">${esc(target(w))}</div>${save.lang==='zh'?`<div class="pinyin">${esc(w.py)}</div>`:''}<button type="button" class="speech" data-action="speak" data-id="${w.id}">🔊 Nghe phát âm</button>${app.revealed?`<div class="translation">🇻🇳 ${esc(w.vi)}</div><small>Hãy tự đánh giá mức độ ghi nhớ của bạn.</small>`:`<small style="margin-top:10px">Nhìn từ và thử đoán nghĩa trước khi lật thẻ</small>`}</div><div class="flash-actions">${app.revealed?`<button type="button" class="btn secondary" data-action="flash-mark" data-ok="0">🔁 Chưa nhớ</button><button type="button" class="btn primary" data-action="flash-mark" data-ok="1">✅ Đã nhớ</button>`:`<button type="button" class="btn primary" data-action="reveal">✨ Lật thẻ xem nghĩa</button>`}<button type="button" class="btn ghost" data-action="flash-next">Bỏ qua →</button></div></div>`}
    function makeQuiz(mode){let z=byZone(app.zone),questions=pick(z,6);return {mode,questions,index:0,correct:0,hearts:3,answered:false,selected:'',done:false}}
    function choicesFor(w){return shuffle([w,...pick(byZone(w.zone).filter(x=>x.id!==w.id),3)])}
    function questionView(){let q=app.quiz;if(q.done)return resultView();let w=q.questions[q.index];if(!w)return resultView();if(!q.options||q.optionIndex!==q.index){q.options=choicesFor(w);q.optionIndex=q.index}
      let isQuest=q.mode==='quest';return `${stageCrumb(isQuest?'Nhiệm vụ NPC':'Nghe và chọn')}<div class="stage"><div class="stage-head"><b>${isQuest?'🧭 Nhiệm vụ NPC':'🎧 Listening Challenge'}</b><span class="pill">Câu ${q.index+1} / ${q.questions.length}</span><span class="hearts" title="Số lượt sai cho phép">${isQuest?'❤️'.repeat(q.hearts)+'🤍'.repeat(3-q.hearts):'✅ '+q.correct+' đúng'}</span></div><div class="progress" style="margin-bottom:15px"><span style="width:${q.index/q.questions.length*100}%"></span></div><div class="question-card fade">${isQuest?`<div class="npc">${ZONES.find(z=>z.id===app.zone).npc}</div><div class="request">“${esc(phrase(w))}”</div><div class="sub">Chọn đúng đồ vật để giúp mình nhé!</div><button type="button" class="speech" style="margin-top:11px" data-action="speak-phrase" data-id="${w.id}">🔊 Nghe yêu cầu</button>`:`<div class="npc">🎧</div><div class="request">Nghe và chọn từ bạn vừa nghe</div><div class="sub">Bấm loa để nghe lại. Đáp án được hiển thị bên dưới.</div><button type="button" class="speech" style="margin-top:15px" data-action="speak" data-id="${w.id}">🔊 Phát âm từ</button>`}</div><div class="answer-grid">${q.options.map(o=>{let klass=q.answered?(o.id===w.id?'correct':o.id===q.selected?'wrong':''):'';return `<button type="button" class="answer ${klass}" data-action="answer" data-id="${o.id}" ${q.answered?'disabled':''}>${isQuest?`<span class="emoji">${o.emoji}</span><span>${esc(o.vi)}</span>`:`<span>${esc(target(o))}</span>`}</button>`}).join('')}</div>${q.answered?`<div class="feedback ${q.selected===w.id?'good':''}" role="status">${q.selected===w.id?'✨ Chính xác! +10 XP và +3 xu.':'💗 Chưa đúng, cùng ghi nhớ nhé.'} <b>${esc(w.en)}</b> · ${esc(w.zh)} (${esc(w.py)}) = ${esc(w.vi)}</div><div class="flash-actions"><button type="button" class="btn primary" data-action="quiz-next">${q.index===q.questions.length-1||q.hearts===0?'Xem kết quả →':'Câu tiếp theo →'}</button></div>`:''}</div>`}
    function matchStart(){const ids=pick(byZone(app.zone),5).map(w=>w.id);return {ids,orderLeft:shuffle([...ids]),orderRight:shuffle([...ids]),selected:null,solved:[],errors:0,notice:'',done:false}}
    function matchView(){let m=app.match;if(m.done)return resultView();return `${stageCrumb('Ghép cặp')}<div class="stage"><div class="stage-head"><b>🧩 Ghép cặp từ vựng</b><span class="pill">${m.solved.length} / ${m.ids.length} cặp</span></div><div class="progress"><span style="width:${m.solved.length/m.ids.length*100}%"></span></div><p class="muted" style="margin:17px 0 8px;text-align:center">Chọn một từ ở cột trái và nghĩa tương ứng ở cột phải.</p><div class="match-columns"><div class="match-col">${m.orderLeft.map(id=>matchButton(id,'word',m)).join('')}</div><div class="match-col">${m.orderRight.map(id=>matchButton(id,'meaning',m)).join('')}</div></div><div class="feedback ${m.notice.startsWith('✅')?'good':''}" role="status" style="text-align:center">${esc(m.notice||'Chọn một từ để bắt đầu ghép cặp!')}</div></div>`}
    function matchButton(id,side,m){const w=BY_ID[id],done=m.solved.includes(id),selected=m.selected&&m.selected.id===id&&m.selected.side===side;return `<button type="button" data-action="match-pick" data-id="${id}" data-side="${side}" ${done?'disabled':''} class="match-button ${done?'done':''} ${selected?'selected':''}">${side==='word'?esc(target(w)):esc(w.vi)}${done?' ✓':''}</button>`}
    function endQuiz(){const q=app.quiz;q.done=true;let win=q.correct>=5;if(q.mode==='quest'&&win){let badge=`${save.lang}|${app.zone}`;if(!save.badges[badge]){save.badges[badge]=true;save.stars++;app.lastReward='⭐ Sao mới! +30 XP · +15 xu';reward(30,15)}else{app.lastReward='+15 XP · +8 xu';reward(15,8)}}else if(q.mode==='listen'){app.lastReward=`+${q.correct*2} XP · +${q.correct} xu`;reward(q.correct*2,q.correct)}else{app.lastReward=win?'Luyện tập rất tốt!':'Hãy thử lại để giành sao nhé!'}persist()}
    function resultView(){let isMatch=app.mode==='match',q=app.quiz,m=app.match,ok=isMatch?m.ids.length:(q?q.correct:0),total=isMatch?m.ids.length:(q?q.questions.length:6);let win=isMatch||ok>=5;let trophy=win?'🏆':'🌷';return `${stageCrumb('Kết quả')}<div class="stage result fade"><div class="trophy">${trophy}</div><h2>${win?'Xuất sắc lắm!':'Bạn đang tiến bộ!'}</h2><p class="muted">${isMatch?'Bạn đã ghép đúng tất cả các cặp từ.':'Bạn trả lời đúng '+ok+'/'+total+' câu trong thử thách.'}</p><div class="reward">${esc(app.lastReward||'Hoàn thành thử thách ✨')}</div><p class="muted">${!win&&app.mode==='quest'?'Cần đúng ít nhất 5/6 câu để nhận sao. Hãy thử lại nhé.':'Từ vựng đã được cập nhật vào lịch ôn tập của bạn.'}</p><div class="flash-actions"><button type="button" class="btn primary" data-action="start" data-mode="${app.mode}">🔁 Chơi lại</button><button type="button" class="btn secondary" data-action="zone" data-zone="${app.zone}">Về khu vực</button><button type="button" class="btn ghost" data-action="map">Bản đồ</button></div></div>`}
    function bookView(){const entries=WORDS.filter(w=>{let query=app.bookQuery.trim().toLocaleLowerCase();return (!query||[w.en,w.zh,w.py,w.vi].join(' ').toLocaleLowerCase().includes(query))&&(app.bookFilter==='all'||(app.bookFilter==='new'?stage(w)==='new':app.bookFilter==='due'?ready(w):app.bookFilter==='mastered'?stage(w)==='mastered':w.zone===app.bookFilter))});return `<div class="section-row"><div><div class="eyebrow">TỦ SÁCH CỦA MÌNH</div><h1 style="margin:0">Sổ từ vựng 📒</h1></div><span class="pill">${WORDS.length} từ / ngôn ngữ</span></div><p class="muted">Tìm từ, nghe phát âm, kiểm tra mức độ ghi nhớ hoặc ôn lại từ đến hạn.</p><div class="book-tools"><input class="search" id="dictionarySearch" aria-label="Tìm từ vựng" type="search" placeholder="🔎 Tìm English, 中文, Pinyin, tiếng Việt..." value="${esc(app.bookQuery)}" autocomplete="off"><select id="dictionaryFilter" class="select" aria-label="Lọc từ vựng"><option value="all" ${app.bookFilter==='all'?'selected':''}>Tất cả từ</option><option value="due" ${app.bookFilter==='due'?'selected':''}>Đến hạn ôn</option><option value="new" ${app.bookFilter==='new'?'selected':''}>Chưa học</option><option value="mastered" ${app.bookFilter==='mastered'?'selected':''}>Thành thạo</option>${ZONES.map(z=>`<option value="${z.id}" ${app.bookFilter===z.id?'selected':''}>${z.title}</option>`).join('')}</select><button type="button" data-action="review" class="btn primary">🔁 Ôn tập (${dueCount()})</button></div><div id="wordResults">${wordResults(entries)}</div>`}
    function wordResults(entries){return entries.length?`<div class="word-list">${entries.map(w=>{const st=stage(w);const badge=st==='mastered'?'🏅 Thành thạo':st==='due'?'🔁 Cần ôn':st==='learning'?'🌱 Đang học':'✨ Chưa học';return `<div class="word-row"><div class="pic">${w.emoji}</div><div class="details"><b>${esc(target(w))}</b>${save.lang==='zh'?`<small>${esc(w.py)}</small>`:''}<small>${esc(w.vi)} · ${badge}</small></div><button type="button" class="speak-small" data-action="speak" data-id="${w.id}" aria-label="Nghe phát âm ${esc(target(w))}">🔊</button></div>`}).join('')}</div>`:`<div class="empty"><div class="face">🔎</div><h3>Không tìm thấy từ phù hợp</h3><p>Thử một từ khóa khác hoặc chọn bộ lọc Tất cả từ.</p></div>`}
    function shopView(){let pet=PETS.find(x=>x.id===save.pet)||PETS[0];return `<div class="section-row"><div><div class="eyebrow">GÓC THÚ CƯNG</div><h1 style="margin:0">Ngôi nhà bạn nhỏ 🐾</h1></div><span class="pill">🪙 ${save.coins} xu</span></div><div class="card" style="margin-bottom:20px;background:linear-gradient(110deg,#ffebf0,#fff3da)"><div class="mini-pet"><div class="animal" style="width:108px;height:108px;font-size:4.8rem">${pet.icon}</div><div><h2 style="margin:0">${pet.name}</h2><p class="muted" style="margin:6px 0">Học từ, hoàn thành thử thách để kiếm xu và đón thêm bạn đồng hành!</p><span class="tag green">Đang đồng hành ♡</span></div></div></div><h2>Bộ sưu tập bạn nhỏ</h2><div class="shop-grid">${PETS.map(p=>{const owned=save.pets.includes(p.id),active=save.pet===p.id;return `<div class="shop-item"><div class="pet-big">${p.icon}</div><h3>${p.name}</h3><p>${p.desc}</p><button type="button" class="btn ${active?'mint':owned?'secondary':'primary'} full sm" data-action="pet" data-id="${p.id}" ${active?'disabled':''}>${active?'✓ Đang chọn':owned?'Chọn bạn này':'🪙 '+p.cost+' xu'}</button></div>`}).join('')}</div>`}
    function reviewStart(){let words=WORDS.filter(ready);if(!words.length){app.notice='Bạn chưa có từ đến hạn ôn tập. Hãy chơi hoặc học Flashcard trước nhé.';render();return}app.reviewIds=shuffle(words.map(w=>w.id));app.zone=words[0].zone;app.flashIndex=0;app.revealed=false;app.flashReview=true;app.route='game';app.mode='flash';app.notice='';render()}
    function startMode(mode){if(!['flash','quest','match','listen'].includes(mode))return;app.route='game';app.mode=mode;app.flashReview=false;app.flashIndex=0;app.revealed=false;app.notice='';app.lastReward=null;if(mode==='quest'||mode==='listen')app.quiz=makeQuiz(mode);if(mode==='match')app.match=matchStart();render()}
    function advanceFlash(){let words=app.flashReview?app.reviewIds.map(id=>BY_ID[id]).filter(Boolean):byZone(app.zone);if(app.flashIndex>=words.length-1){app.route='zone';app.flashReview=false;app.notice='🎉 Bạn đã xem hết bộ Flashcard! Giờ hãy thử chơi Minigame nhé.'}else{app.flashIndex++;app.revealed=false}render()}
    function setRoute(route){app.route=route;app.notice='';render();window.scrollTo({top:0,behavior:'auto'})}
    function render(){refreshDaily();let content='';switch(app.route){case 'home':content=home();break;case 'map':content=mapView();break;case 'zone':content=zoneView();break;case 'game':content=app.mode==='flash'?flashView():app.mode==='match'?matchView():questionView();break;case 'book':content=bookView();break;case 'shop':content=shopView();break;default:content=home()}
      root.innerHTML=header()+`<main id="main-content">${app.notice?`<div class="alert" role="status">${esc(app.notice)} <button type="button" data-action="close-notice" style="float:right;border:0;background:transparent;color:inherit;font-weight:900" aria-label="Đóng thông báo">✕</button></div>`:''}${content}</main><footer class="footer">Made with ♡ for language explorers · LingoTown v1.0 · Dữ liệu lưu trên trình duyệt của bạn</footer>`}
    root.addEventListener('click',e=>{const btn=e.target.closest('button[data-action],a[data-action]');if(!btn||!root.contains(btn))return;if(btn.tagName==='A')e.preventDefault();const action=btn.dataset.action,id=btn.dataset.id;
      if(action==='home'||action==='map'||action==='book'||action==='shop'){setRoute(action);return}
      if(action==='lang'){if(!['en','zh'].includes(btn.dataset.lang))return;save.lang=btn.dataset.lang;persist();app.bookQuery='';if(app.route==='game')app.route='zone';app.notice='';render();return}
      if(action==='zone'){if(!unlocked(btn.dataset.zone))return;app.zone=btn.dataset.zone;setRoute('zone');return}
      if(action==='start'){startMode(btn.dataset.mode);return}
      if(action==='close-notice'){app.notice='';render();return}
      if(action==='claim'){refreshDaily();if(save.daily.correct>=5&&!save.daily.claimed){save.daily.claimed=true;reward(0,20);app.notice='🎁 Nhận thành công 20 xu thưởng hôm nay!';render()}return}
      if(action==='speak'||action==='speak-phrase'){if(BY_ID[id])pronunciation(BY_ID[id],action==='speak-phrase');return}
      if(action==='review'){reviewStart();return}
      if(action==='reveal'){app.revealed=true;render();return}
      if(action==='flash-next'){advanceFlash();return}
      if(action==='flash-mark'){let words=app.flashReview?app.reviewIds.map(x=>BY_ID[x]).filter(Boolean):byZone(app.zone);let w=words[app.flashIndex];if(!w||!app.revealed)return;const ok=btn.dataset.ok==='1';record(w,ok);if(ok)reward(4,2);advanceFlash();return}
      if(action==='answer'){let q=app.quiz;if(!q||q.answered||q.done||!q.options.some(w=>w.id===id))return;let w=q.questions[q.index];q.selected=id;q.answered=true;if(id===w.id){q.correct++;reward(10,3);record(w,true)}else{q.hearts=Math.max(0,q.hearts-1);record(w,false)}render();return}
      if(action==='quiz-next'){let q=app.quiz;if(!q||!q.answered)return;if(q.index===q.questions.length-1||(q.mode==='quest'&&q.hearts===0)){endQuiz()}else{q.index++;q.answered=false;q.selected='';q.options=null}render();return}
      if(action==='match-pick'){let m=app.match;if(!m||m.done||m.solved.includes(id))return;let side=btn.dataset.side;if(!['word','meaning'].includes(side)||!m.ids.includes(id))return;if(!m.selected){m.selected={id,side};m.notice='Chọn một thẻ ở cột còn lại.';render();return}if(m.selected.side===side){m.selected={id,side};m.notice='Chọn nghĩa ở cột còn lại nhé.';render();return}let first=m.selected;m.selected=null;if(first.id===id){m.solved.push(id);record(BY_ID[id],true);reward(8,3);m.notice='✅ Tuyệt vời! Bạn ghép chính xác.';if(m.solved.length===m.ids.length){m.done=true;app.lastReward='+20 XP · +15 xu';reward(20,15)}}else{m.errors++;record(BY_ID[first.id],false);m.notice='Chưa đúng! Thử ghép lại nhé.'}render();return}
      if(action==='pet'){let p=PETS.find(x=>x.id===id);if(!p)return;if(!save.pets.includes(id)){if(save.coins<p.cost){app.notice=`Bạn cần thêm ${p.cost-save.coins} xu để đón ${p.name}.`;render();return}save.coins-=p.cost;save.pets.push(id)}save.pet=id;persist();app.notice=`${p.icon} ${p.name} đã trở thành bạn đồng hành!`;render();return}
    });
    root.addEventListener('input',e=>{if(e.target.id!=='dictionarySearch')return;app.bookQuery=e.target.value;const out=root.querySelector('#wordResults');if(!out)return;const q=app.bookQuery.trim().toLocaleLowerCase();let words=WORDS.filter(w=>(!q||[w.en,w.zh,w.py,w.vi].join(' ').toLocaleLowerCase().includes(q))&&(app.bookFilter==='all'||(app.bookFilter==='new'?stage(w)==='new':app.bookFilter==='due'?ready(w):app.bookFilter==='mastered'?stage(w)==='mastered':w.zone===app.bookFilter)));out.innerHTML=wordResults(words)});
    root.addEventListener('change',e=>{if(e.target.id==='dictionaryFilter'){app.bookFilter=e.target.value;render()}});
    render();
  })();
  </script>
</body>
</html>
